services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riffa
      POSTGRES_PASSWORD: riffa
      POSTGRES_DB: riffa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riffa -d riffa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://riffa:riffa@postgres:5432/riffa
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
